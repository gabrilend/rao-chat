# rao-chat-failed-decryption.conf — a fail2ban filter for rao-chat's
# failed-decryption log, grammar v1 (docs/failed-decryption-log.md).
#
# A line:
#   1793878367 2026-11-05T11:52:47Z rao-chat failed-decryption v1 from=127.0.0.3 port=5555 to-port=7501 length=40 reason=no-key
#
# The time is taken from the first field (whole seconds since 1970).  The
# pattern does not rely on whether fail2ban cuts that field out of the
# line before matching: the seconds are optional in it.

[Definition]

datepattern = {^LN-BEG}EPOCH

failregex = ^\s*(?:\d+\s+)?\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ rao-chat failed-decryption v1 from=<HOST> port=\d+ to-port=\d+ length=\d+ reason=(?:no-key|length)\s*$

ignoreregex =
